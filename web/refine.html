<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Refine</title>
<link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/static/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/static/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/apple-touch-icon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<!-- Theme before first paint: an external script would flash the wrong palette -->
<script>try{var t=localStorage.getItem('tg_theme');if(t==='dark')document.documentElement.dataset.theme='dark';}catch(e){}</script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#faf9f7;--card:#fff;--text:#1c1917;--dim:#a09b93;--border:#eae7e2;
  --accent:#1c1917;--accent-hover:#3f3a36;--accent-soft:#f0eeea;--accent-soft-hover:#e6e3dd;
  --accent-fg:#fff;        /* text on --accent (primary buttons) */
  --ok:#16a34a;--ok-soft:#e9f7ee;--ok-soft-hover:#daf0e2;
  --err:#dc2626;--err-hover:#c7202f;--err-soft:#fdeceb;--err-soft-hover:#fadcda;
  --warn:#b45309;--warn-soft:#fdf3e3;--warn-soft-hover:#f8e9cf;
  --dark:#1c1917;--shadow:0 1px 2px rgba(28,25,23,.05);
  --rail-w:170px;          /* width of Keys / Actions side rails */
  --screen-h:260px;        /* min-height of the screenshot area */
}
/* Night theme (Warm Mono dark) — toggled via data-theme on <html> */
:root[data-theme="dark"]{
  --bg:#1a1917;--card:#242220;--text:#ece9e4;--dim:#8a847c;--border:#35322e;
  --accent:#ece9e4;--accent-hover:#d8d4cd;--accent-soft:#302d2a;--accent-soft-hover:#3a3733;
  --accent-fg:#1a1917;
  --ok:#22c55e;--ok-soft:#183a25;--ok-soft-hover:#1f4a2f;
  --err:#f05252;--err-hover:#e23b3b;--err-soft:#3a1e1e;--err-soft-hover:#4a2525;
  --warn:#eab308;--warn-soft:#3a2f18;--warn-soft-hover:#4a3d1f;
  --dark:#100f0d;--shadow:0 1px 3px rgba(0,0,0,.45);
}
body{font-family:'Inter','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:16px}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
h1{font-size:17px;font-weight:600;text-align:center;padding:6px 0 2px;letter-spacing:-.2px}
.theme-toggle{position:absolute;top:16px;right:16px;width:34px;height:34px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:16px;cursor:pointer;line-height:1;z-index:50;box-shadow:var(--shadow)}
.theme-toggle:hover{background:var(--accent-soft)}
/* Cross-link back to the full dashboard, mirroring .theme-toggle on the left. */
.view-link{position:absolute;top:16px;left:16px;height:34px;display:inline-flex;align-items:center;gap:5px;padding:0 12px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:13px;font-weight:500;text-decoration:none;z-index:50;box-shadow:var(--shadow)}
.view-link:hover{background:var(--accent-soft)}

.panel{background:var(--card);border-radius:14px;padding:14px;border:1px solid var(--border);box-shadow:var(--shadow);min-width:0}
.panel h3{font-size:11px;font-weight:600;color:var(--dim);margin-bottom:10px;text-transform:uppercase;letter-spacing:1.2px}

.btn{padding:8px 14px;border:1px solid var(--border);border-radius:9px;cursor:pointer;font-size:13px;font-weight:500;font-family:inherit;background:var(--card);color:var(--text);transition:background .15s,transform .1s,border-color .15s}
.btn:hover{background:var(--accent-soft)}
.btn:active{transform:scale(.96)}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-red{background:var(--err);border-color:var(--err);color:#fff}
.btn-red:hover{background:var(--err-hover)}
.btn-soft{background:var(--accent-soft);border-color:transparent;color:var(--text)}
.btn-soft:hover{background:var(--accent-soft-hover)}
.btn-ok-soft{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn-ok-soft:hover{background:var(--ok-soft-hover)}
.btn-red-soft{background:var(--err-soft);border-color:transparent;color:var(--err)}
.btn-red-soft:hover{background:var(--err-soft-hover)}
.btn-sm{padding:6px 11px;font-size:12px}
.btn[disabled]{opacity:.4;cursor:not-allowed}

select{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:9px;background:var(--card);color:var(--text);font-size:13px;font-family:inherit;cursor:pointer}
.hint{font-size:11px;color:var(--dim);margin-top:8px;line-height:1.4}
.input-row{display:flex;gap:6px;align-items:flex-start}
.input-row textarea{flex:1 1 auto;min-width:0;background:var(--card);border:1px solid var(--border);border-radius:9px;padding:9px 12px;color:var(--text);font-size:13px;font-family:inherit;resize:vertical;min-height:140px;max-height:400px;line-height:1.4;transition:border-color .15s,box-shadow .15s}
.input-row textarea::placeholder{color:var(--dim)}
.input-row textarea:focus,select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

/* Controls sit ABOVE the field so the thumb reaches mic/Improve without
   scrolling past a tall textarea; Copy sits below, away from the mic. */
.type-controls{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.type-controls select{width:auto;flex:1 1 auto;min-width:0}
.type-controls .btn:not(#mic-btn):not(#imp-btn){width:88px;flex-shrink:0}
#imp-btn{flex-shrink:0}
#mic-btn{flex:1;min-height:46px;font-size:15px;display:flex;align-items:center;justify-content:center}
.out-row{display:flex;gap:8px;align-items:center;margin-top:8px}
#copy-btn{flex:1;min-height:44px;font-size:14px}

/* Rendered markdown preview of the Type field (headers/tables/code like a file view) */
.md-body{border:1px solid var(--border);border-radius:9px;padding:10px 12px;margin-top:8px;font-size:13px;max-height:320px;overflow:auto;background:var(--card)}
.md-body h1,.md-body h2,.md-body h3,.md-body h4,.md-body h5,.md-body h6{margin:8px 0 4px;line-height:1.25}
.md-body h1{font-size:17px}.md-body h2{font-size:15px}.md-body h3{font-size:14px}
.md-body h4,.md-body h5,.md-body h6{font-size:13px}
.md-body p{margin:4px 0}
.md-body ul,.md-body ol{margin:4px 0 4px 18px}
.md-body code{background:var(--accent-soft);border-radius:4px;padding:1px 4px;font-size:12px}
.md-body pre{background:var(--accent-soft);border-radius:8px;padding:8px 10px;overflow-x:auto;margin:6px 0}
.md-body pre code{background:none;padding:0}
.md-body table{border-collapse:collapse;margin:6px 0;font-size:12px}
.md-body th,.md-body td{border:1px solid var(--border);padding:4px 8px;text-align:left}
.md-body blockquote{border-left:3px solid var(--border);margin:4px 0;padding:2px 10px;color:var(--dim)}
.md-body a{color:inherit}

.counter{font-size:11px;color:var(--dim);margin-left:auto;white-space:nowrap;font-variant-numeric:tabular-nums}

/* Wide screens: edit and read side by side, both panes filling the viewport.
   This view is a document editor — a 640px column stranded in a 2000px window
   with the text scrolling inside 400px of it was the whole complaint. */
@media(min-width:760px){
  .split.md-on{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:stretch}
  .split .input-row{height:100%}
  .split textarea,.split.md-on .md-body{height:calc(100vh - 300px);min-height:340px;max-height:none}
  .split.md-on .md-body{margin-top:0;overflow:auto}
}
/* Long-form reading: cap the measure inside the pane rather than the pane itself,
   so the column stays comfortable while the panel still uses the window. */
.md-body>*{max-width:78ch}

.action-status{margin-top:10px;padding:8px 10px;border-radius:9px;background:var(--accent-soft);font-size:11px;line-height:1.45;color:var(--dim);word-break:break-word;min-height:33px}
.action-status b{display:block;color:var(--text);font-weight:500}
.action-status.err b{color:var(--err)}
.action-status.ok b{color:var(--ok)}

#history-list{max-height:220px;overflow-y:auto;resize:vertical;display:flex;flex-direction:column;gap:2px}
.hist-row{display:flex;gap:8px;align-items:baseline;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:12px}
.hist-row:hover{background:var(--accent-soft)}
.hist-time{color:var(--dim);flex-shrink:0;font-size:11px}
.hist-kind{flex-shrink:0;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.5px;color:var(--ok)}
.hist-kind.shell{color:var(--err)}
.hist-kind.claude{color:#7c3aed}
.hist-kind.image{color:#0369a1}
.hist-kind.draft{color:var(--dim)}
.hist-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}

#toast{position:fixed;bottom:20px;right:20px;background:var(--card);border:1px solid var(--border);border-radius:10px;padding:10px 16px;font-size:13px;display:none;z-index:300;max-width:300px;box-shadow:0 4px 16px rgba(28,25,23,.1)}
#toast.error{border-color:var(--err);color:var(--err)}
#toast.ok{border-color:var(--ok);color:var(--ok)}

#auth-overlay{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:100}
#auth-box{background:var(--card);padding:28px;border-radius:16px;text-align:center;border:1px solid var(--border);box-shadow:var(--shadow)}
#auth-box h2{margin-bottom:16px;font-size:17px;font-weight:600}
#auth-box input{width:240px;padding:10px 12px;border-radius:9px;border:1px solid var(--border);background:var(--card);color:var(--text);font-size:14px;margin-bottom:12px;font-family:inherit}
#auth-box input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}

.spinner{display:inline-block;width:14px;height:14px;border:2px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .6s linear infinite;margin-right:6px;vertical-align:middle}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
</head>
<body>

<div id="auth-overlay">
  <div id="auth-box">
    <h2>Refine</h2>
    <input type="password" id="token-input" placeholder="Access token" onkeydown="if(event.key==='Enter')doAuth()">
    <br><button class="btn btn-primary" onclick="doAuth()">Connect</button>
  </div>
</div>

<div id="main" style="display:none">
<a class="view-link" href="/" title="Full dashboard: screen, keys, shell, projects">&#128421; Dashboard</a>
<button class="theme-toggle" id="theme-toggle" onclick="toggleTheme()">&#127769;</button>
<div class="wrap">
  <h1>Refine</h1>
  <!-- Not decoration: sttUpload() reports upload progress through [data-status],
       and a 19MB WAV over a phone tunnel is a long silent wait without it. -->
  <div class="action-status" data-status>Ready</div>

  <div class="panel" id="type-panel">
    <h3>Type</h3>
      <div class="type-controls">
        <button class="btn btn-soft" id="human-btn" onclick="toggleHumanize()" title="Clean up the transcript via LLM before it lands in the field">AI: ON</button>
        <button class="btn btn-soft" id="mic-btn" onclick="toggleMic()" title="Voice to text"></button>
      </div>
      <div class="type-controls">
        <button class="btn btn-soft" id="twin-btn" onclick="toggleTwin()" title="Inject the HAE operator profile into Improve so the result sounds like you">Twin: OFF</button>
        <select id="imp-style" onchange="impStyleChanged()" title="Improve style">
          <option value="structured" selected>Structured</option>
          <option value="detailed">Detailed</option>
          <option value="concise">Concise</option>
          <option value="translate">&rarr; EN</option>
        </select>
        <button class="btn btn-soft" id="imp-btn" onclick="doImprove()" title="Rewrite the text below with AI — the original is saved to History first">&#10024; Improve</button>
        <button class="btn btn-soft" id="md-btn" onclick="toggleMd()" title="Render the text below as markdown (headers, tables, code)">MD: ON</button>
      </div>
    <div class="split" id="type-split">
      <div class="input-row">
        <textarea id="type-input" rows="6" placeholder="Dictate or type rough text, then Improve it. Nothing is sent to your PC."></textarea>
      </div>
      <div class="md-body" id="md-preview" style="display:none"></div>
    </div>
    <div class="out-row">
      <button class="btn btn-primary" id="copy-btn" onclick="doCopy()">&#128203; Copy</button>
      <button class="btn btn-soft btn-sm" id="clear-btn" onclick="doClear()">Clear</button>
      <span class="counter" id="char-count"></span>
    </div>
    <p class="hint">Nothing is typed to your PC. Text leaves this view only via Copy.</p>
  </div>

  <div class="panel">
    <h3>History <button class="btn btn-sm btn-soft" style="float:right;margin-top:-4px" onclick="clearHistory()">Clear</button></h3>
    <div id="history-list"></div>
  </div>
</div>
</div>

<div id="toast"></div>

<!-- Page-local config, BEFORE common.js reads it at load -->
<script>
/* This field is a document being produced to paste elsewhere, so rendered
   markdown is the point (the dashboard's field is terminal input — noise).
   Separate key, or a choice made here pushes the dashboard's presets off screen. */
/* Refuse the ambient Telegram credential: common.js must not park initData in a
   page-lifetime global here. This view mints a scope-limited token instead. */
window.NO_AMBIENT_AUTH = true;
window.MD_STORAGE_KEY = 'tg_md_refine';
window.MD_DEFAULT_ON = true;
/* One field, so every history kind refills it — a shell line is still text
   you might want to refine. */
window.HISTORY_TARGETS = {type: 'type-input', draft: 'type-input',
                          shell: 'type-input', claude: 'type-input'};
</script>
<script src="/static/common.js?v=0.19.1"></script>
<script>
/* ===== Refine view =====
   Runs on a refine-scoped token, not the full credential. The server rejects
   that token on every system route, so a bug on this page cannot type, shell or
   restart anything — see _check_auth_refine() in handlers/web.py.

   Honest limit: inside Telegram, Telegram.WebApp.initData is readable by any
   script here and IS a full credential. Nothing a page does can stop an operator
   with devtools from re-authing as themselves. What this buys is that the page's
   OWN code path never holds one — initData is read inside the mint call only and
   never stored — so an accidental system call fails at the server. */

const SCOPE_KEY = 'tg_scope_refine';
let _scope = null, _minting = null;

/* The ambient full credential, read on demand and NEVER stored. index.html
   keeps one in `const TG` for the life of the page; this view must not, so that
   its own code has nothing full-powered within reach. */
function _fullCred() {
  return (window.Telegram && Telegram.WebApp && Telegram.WebApp.initData) || '';
}

/* Every request from this page carries the scoped bearer and nothing else —
   common.js reads this hook instead of initData/TOKEN. */
window.AUTH_HEADERS = () => (_scope ? {'Authorization': 'Bearer ' + _scope.token} : {});

function _loadScope() {
  try {
    const s = JSON.parse(sessionStorage.getItem(SCOPE_KEY) || 'null');
    if (s && s.token && s.exp > Date.now() / 1000 + 60) return s;
  } catch (e) {}
  return null;
}

/* Full credential -> scope-limited one. initData is read HERE and nowhere else,
   and never stored, so the page's steady-state code path holds no full credential. */
async function _mintScope() {
  if (_minting) return _minting;                 // parallel 401s mint once, not five
  _minting = (async () => {
    const headers = {'Content-Type': 'application/json'};
    const initData = _fullCred();
    if (initData) headers['X-Telegram-Init-Data'] = initData;
    else headers['Authorization'] = 'Bearer ' + TOKEN;
    try {
      const r = await fetch(BASE + '/api/scope', {
        method: 'POST', headers, cache: 'no-store',
        body: JSON.stringify({scope: 'refine'}),
      });
      const d = await r.json();
      if (!d.ok || !d.token) return null;
      _scope = {token: d.token, exp: Math.floor(Date.now() / 1000) + d.ttl};
      sessionStorage.setItem(SCOPE_KEY, JSON.stringify(_scope));   // never localStorage:
      return _scope;                             // that is where the permanent token lives
    } catch (e) { return null; }
    finally { _minting = null; }
  })();
  return _minting;
}

async function _ensureScope() {
  if (!_scope || _scope.exp - Date.now() / 1000 < 300)   // refresh before the stall,
    _scope = _loadScope() || await _mintScope();         // not after a visible 401
  return _scope;
}

/* Mint before, retry ONCE after a 401. Never more than once — an unbounded
   refresh loop through the tunnel is the wedge API_TIMEOUT exists to prevent. */
function _isAuthErr(r) {
  return r && r.ok === false && /nauthorized|Session expired/i.test(r.error || '');
}

const _rawApi = api;
api = async function (method, path, body, timeoutMs) {
  if (!await _ensureScope()) return {ok: false, error: 'Not authorized'};
  let r = await _rawApi(method, path, body, timeoutMs);
  if (_isAuthErr(r)) {
    _scope = null;
    sessionStorage.removeItem(SCOPE_KEY);
    if (!await _mintScope()) return r;
    r = await _rawApi(method, path, body, timeoutMs);
  }
  return r;
};

/* toggleMic() calls sttUpload() directly, bypassing api() — it needs the same
   freshness guarantee or a 12h-idle tab 401s on a finished recording. */
const _rawStt = sttUpload;
sttUpload = async function (blob) {
  // Without the guard a failed mint uploads the recording with NO auth header,
  // which reads to the user as "the mic button does nothing".
  if (!await _ensureScope()) return {ok: false, error: 'Not authorized — reopen the view'};
  let r = await _rawStt(blob);
  if (_isAuthErr(r)) {
    _scope = null;
    sessionStorage.removeItem(SCOPE_KEY);
    if (!await _mintScope()) return r;
    r = await _rawStt(blob);      // one retry, same rule as api()
  }
  return r;
};

async function checkAuth() {
  const r = await api('GET', '/api/status');
  if (r.ok) {
    if (_checkStaleClient(r.version)) return;    // reloading past the webview cache
    document.getElementById('auth-overlay').style.display = 'none';
    document.getElementById('main').style.display = 'block';
    setStatus('Connected to bot v' + r.version, false);
  } else {
    toast(r.error || 'Invalid token', true);
  }
}

/* ===== Copy =====
   The clipboard write must be the FIRST async thing here: any prior await drops
   transient user activation and Telegram's Android webview then silently refuses
   — the classic "works on desktop, does nothing on my phone". */
const COPY_MAX = 500000;

function _selectField(el) {
  el.focus();
  el.select();
  try { el.setSelectionRange(0, el.value.length); } catch (e) {}
}

function _copyFallback(text, el) {
  // Hidden, but RENDERED — display:none can't be selected on iOS.
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.setAttribute('readonly', '');
  ta.style.cssText = 'position:fixed;left:-9999px;top:0;opacity:0';
  document.body.appendChild(ta);
  const from = el.selectionStart, to = el.selectionEnd;
  ta.focus();
  ta.select();
  try { ta.setSelectionRange(0, text.length); } catch (e) {}
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) {}
  ta.remove();
  el.focus();                                   // restore the caret, or the user
  try { el.setSelectionRange(from, to); } catch (e) {}   // loses their place
  return ok;
}

function _haptic() {
  try { Telegram.WebApp.HapticFeedback.notificationOccurred('success'); } catch (e) {}
}

async function doCopy() {
  const el = document.getElementById('type-input');
  const text = el.value;
  const n = text.length.toLocaleString('en-US').replace(/,/g, ' ');
  if (!text.trim()) {
    // Do NOT touch the clipboard — silently clobbering it with "" is worse
    toast('Nothing to copy — the field is empty', true);
    return;
  }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      _haptic();
      toast('Copied — ' + n + ' chars');
      return;
    } catch (e) { /* webview refused — fall through */ }
  }
  if (text.length > COPY_MAX) {
    // execCommand on a multi-MB string janks the main thread; select instead
    _selectField(el);
    toast('Too long to copy here (' + n + ' chars) — text selected, long-press to copy', true);
    return;
  }
  if (_copyFallback(text, el)) {
    _haptic();
    toast('Copied (fallback) — ' + n + ' chars');
  } else {
    _selectField(el);
    toast('Copy blocked by this webview — text selected, long-press to copy', true);
  }
}

function doClear() {
  const el = document.getElementById('type-input');
  if (!el.value) return;
  addHistory('draft', el.value);        // never lose text to a mis-tap
  el.value = '';
  autoGrow(el);
  _mdAuto('');
  el.focus();
  toast('Cleared — saved to History');
}

/* Side-by-side edit/preview only makes sense while the preview is visible */
function _syncSplit() {
  document.getElementById('type-split').classList.toggle('md-on', _mdOn);
  _fitField();
}
const _mdSync = _syncMd;
_syncMd = function () { _mdSync(); _syncSplit(); };

/* On a wide screen CSS sizes both panes to fill the window. autoGrow writes an
   inline height capped at 400px, which fights that and puts the text back into a
   short scrolling box inside an otherwise empty page — so clear it there
   instead, and keep autoGrow for the stacked phone layout. */
const _wide = () => window.matchMedia('(min-width:760px)').matches;
const _ti = document.getElementById('type-input');

function _fitField() {
  if (_wide()) _ti.style.height = '';
  else _rawGrow(_ti);
}

function _syncCount() {
  const t = _ti.value;
  const words = t.trim() ? t.trim().split(/\s+/).length : 0;
  const n = x => x.toLocaleString('en-US').replace(/,/g, ' ');
  document.getElementById('char-count').textContent =
    t ? n(t.length) + ' chars · ' + n(words) + ' words' : '';
}

const _rawGrow = autoGrow;
autoGrow = function (el) {
  // Every programmatic write (Improve, transcription, history refill, Clear)
  // routes through here, so the counter and the fit follow for free.
  if (el === _ti) {
    _syncCount();
    if (_wide()) { el.style.height = ''; return; }
  }
  _rawGrow(el);
};

_ti.addEventListener('input', () => autoGrow(_ti));
window.addEventListener('resize', _fitField);
_syncSplit();
_syncCount();

/* A full credential must not sit in the address bar (or in a screenshot of it) */
